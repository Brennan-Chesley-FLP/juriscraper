residuals:
- continuation: parse_search_results
  path: html/body/div/main/div/div/div/div/form/span
  ident: Pagination controls of the full-match results table
  disposition: chrome
  note: 'The CMS paginates client-side: every match is already in the HTML, so
    Previous/Next move nothing the scraper has not read.'
  example: Previous
- continuation: parse_search_results
  path: html/body/div/main/div/div/div/div/div/form/span
  ident: Pagination controls of the partial-match results table
  disposition: chrome
  note: Client-side pagination; all rows are in the HTML.
  example: Previous
- continuation: parse_case_general
  path: html/body/div/main/div/div/div/div/table/thead/tr/th
  ident: Table column headers
  disposition: chrome
  note: Every column under these headers is parsed into the row models.
  example: Name
- continuation: parse_case_general
  path: html/body/div/main/div/div/div/div/span
  ident: Placeholder shown when the section is empty
  disposition: chrome
  note: The section's rows are parsed when present; the placeholder carries no
    data of its own.
  example: No Oral Arguments
- continuation: parse_case_general
  path: html/body/div/main/div/div/div/div/div/dl/dt
  ident: Oral-argument field labels
  disposition: chrome
  note: dt labels for the dd values already read into the oral_argument_* fields.
  example: 'Status:'
- continuation: parse_case_parties
  path: html/body/div/main/div/div/div/div/div/span
  ident: Case-title case number and case name
  disposition: chrome
  note: The case-title block heading every case page. Already held as AkDocket.docket_number
    / case_name from the search row and the Case Summary page.
  example: S09486 In Re Joe Micheal Cox v
- continuation: parse_case_parties
  path: html/body/div/main/div/div/div/div/div/div/span
  ident: Case-title special-status badge tooltip (e.g. Expedited)
  disposition: chrome
  note: The case-title block heading every case page. Extracted from the Case
    Summary page into AkDocket.special_status_flags.
  example: Expedited
- continuation: parse_case_parties
  path: html/body/div/main/div/div/div/div/div/div
  ident: Case-title special-status badge glyph (the letter E)
  disposition: chrome
  note: The case-title block heading every case page. The tooltip beside it spells
    the badge out; both are extracted from the Case Summary page into AkDocket.special_status_flags.
  example: E
- continuation: parse_case_parties
