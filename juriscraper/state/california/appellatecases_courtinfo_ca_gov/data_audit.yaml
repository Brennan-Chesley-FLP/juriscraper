  CaDocument:
    join:
    - court
    - docket_number
    as: documents
  CaUnavailableOpinion:
    join:
    - court
    - docket_number
    as: unavailable_opinions
  CaAppCaseUnavailable:
    join:
    - court
    - docket_number
    as: not_found_probes
