# Data audit ledger -- appellatecases.courtinfo.ca.gov
#
# One entry per dotted result path, verdicts qualified by `when:` SQL predicates
# so one file covers all nine courts. `court` is the stratum and equals the run
# db throughout the August 2026 sweep.
#
# An `assert` block's `find` selects the OFFENDING rows. Run it as
#   SELECT result_id, request_id, court, docket_number FROM <on> WHERE <find>
# to get refs that paste straight into a jent expression. Assertions never
# affect a scrape -- a failing pydantic validator would turn the record into an
# unvalidated dict row, which is worse than a flag.
#
# Hand edits survive. Counts are as of the 2026-09-29 audit, against the
# pre-fix corpus; the next sweep is what moves them.

